[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milk-toast-taco"
version = "0.1.0"
description = "Milk Toast Taco - a multi-industry sandbox simulation game by WoofWorks Inc"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "WoofWorks Inc" },
    { name = "FunnyTom777" },
]
keywords = ["game", "simulation", "sandbox", "career"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment :: Simulation",
    "Development Status :: 2 - Pre-Alpha",
]

[project.optional-dependencies]
# Terminal dev dashboard (V1). Core systems depend only on the standard library.
dashboard = ["rich>=13"]
# Phase 2: browser-based dashboard skin over the same command registry.
web = ["Flask>=3"]
# XMB desktop application with pywebview.
xmb = ["pywebview>=5"]
# Dashboard V4 — Native Desktop Hub (PyQt6).
dashboard_v4 = ["PyQt6>=6.5"]
# Dashboard V5 — Textual command prompt over the command registry.
dashboard_v5 = ["textual>=8"]
# Torsion3D engine — Panda3D rendering + DearPyGui debug overlay.
torsion = ["panda3d>=1.10", "dearpygui>=1.10"]
torsion_full = ["panda3d>=1.10", "dearpygui>=1.10", "gltf>=1.0"]
# Development tooling: building distributions.
dev = ["build>=1.2"]

[project.urls]
Homepage = "https://github.com/FunnyTom777/MilkToastTaco"

[project.scripts]
milk-toast-taco = "main:run"

[tool.setuptools.packages.find]
include = ["core*", "torsion*", "engine*"]

[tool.unittest]
# Run with: python -m unittest discover -s core -p "test_*.py"

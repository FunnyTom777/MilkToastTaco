<!DOCTYPE html>
<!-- MTT Dashboard - Milk Toast Taco -->
<!-- Location: core/renderer/dashboard/static/dashboard.html -->
<!-- Served via: core/renderer/dashboard/dashboard.py:get_dashboard_html_path() -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTT Dashboard — Milk Toast Taco</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --xmb-highlight: rgba(255,255,255,0.95);
  --xmb-dim: rgba(255,255,255,0.45);
  --bg-main:#050914; --bg-to:#0a1128; --wave1:rgba(30,80,150,0.15); --wave2:rgba(80,30,150,0.1);
  --accent: #6366f1; --accent2:#8b5cf6;
  --radius:14px; --ease:cubic-bezier(0.25,0.1,0.25,1);
}
*{box-sizing:border-box}
body{
  margin:0; padding:0; overflow:hidden;
  font-family:'Inter',sans-serif;
  background-color:var(--bg-main);
  color:white; user-select:none;
}
.bg-container{
  position:fixed; inset:0; z-index:-1; overflow:hidden;
  background:linear-gradient(135deg,var(--bg-main) 0%,var(--bg-to) 100%);
  transition:background 0.6s var(--ease);
}
.wave{position:absolute; width:200%; height:200%; top:-50%; left:-50%;
  background:radial-gradient(ellipse at center,var(--wave1) 0%,transparent 60%);
  animation:rotateWave 30s linear infinite; transform-origin:center; transition:background 0.6s var(--ease);}
.wave:nth-child(2){background:radial-gradient(ellipse at center,var(--wave2) 0%,transparent 50%); animation:rotateWave 45s linear infinite reverse;}
@keyframes rotateWave{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.2)}100%{transform:rotate(360deg) scale(1)}}
.mono{font-family:'JetBrains Mono',monospace}

/* layout */
#app{
  display:grid; grid-template-rows: 68px 1fr 34px;
  grid-template-columns: 280px 1fr;
  width:100vw; height:100vh;
}
header{
  grid-column:1 / span 2;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px;
  background:rgba(0,0,0,0.35); backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.header-left{display:flex; align-items:center; gap:14px;}
.brand{font-weight:700; letter-spacing:2px; font-size:1.05rem;}
.brand small{font-weight:300; opacity:0.7; letter-spacing:1px; margin-left:8px;}
.badge{font-size:0.7rem; padding:4px 8px; border-radius:999px; border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.06); letter-spacing:0.6px;}
#clock{font-weight:200; letter-spacing:2px; font-size:1rem; opacity:0.9;}
nav.sidebar{
  background:rgba(0,0,0,0.25); backdrop-filter:blur(10px);
  border-right:1px solid rgba(255,255,255,0.06);
  padding:14px 10px; overflow:auto;
}
.nav-item{
  display:flex; align-items:center; gap:12px;
  padding:16px 14px; border-radius:12px; cursor:pointer;
  color:var(--xmb-dim); transition:all 0.18s var(--ease);
  border:1px solid transparent; font-size:0.95rem; min-height:52px;
}
.nav-item:hover{background:rgba(255,255,255,0.06); color:#fff; transform:translateX(2px);}
.nav-item.active{background:linear-gradient(135deg,rgba(59,130,246,0.22),rgba(139,92,246,0.22)); color:#fff; border-color:rgba(99,102,241,0.35); box-shadow:0 0 18px rgba(99,102,241,0.18);}
.nav-item.kb-focus{outline:none; border-color:rgba(255,255,255,0.9); box-shadow:0 0 0 2px rgba(255,255,255,0.9),0 0 18px rgba(99,102,241,0.3); transform:translateX(2px) scale(1.01);}
.nav-item i{width:22px; text-align:center; font-size:1.1rem;}
.nav-hint{margin-top:12px; padding:10px; border-radius:10px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); font-size:0.7rem; color:rgba(255,255,255,0.5); line-height:1.5; letter-spacing:0.3px;}
main.content{overflow:auto; padding:20px; background:transparent;}
.card{
  background:linear-gradient(135deg,rgba(20,20,35,0.75) 0%,rgba(10,10,25,0.9) 100%);
  border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:16px;
  backdrop-filter:blur(10px); box-shadow:0 10px 40px rgba(0,0,0,0.35);
}
.card h3{font-weight:600; font-size:1rem; margin-bottom:6px; display:flex; align-items:center; gap:8px;}
.card p.desc{font-size:0.85rem; color:#a0a0b8; margin-bottom:10px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media(max-width:1000px){#app{grid-template-columns:200px 1fr} .grid2,.grid3{grid-template-columns:1fr} }
@media(max-width:700px){#app{grid-template-columns:1fr; grid-template-rows:68px auto 1fr 34px} nav.sidebar{grid-column:1} main.content{grid-column:1} }

/* HUD bars */
.bar{height:14px; border-radius:999px; background:rgba(255,255,255,0.08); overflow:hidden; border:1px solid rgba(255,255,255,0.08);}
.bar-fill{height:100%; border-radius:999px; transition:width 0.5s var(--ease);}
.kbd{font-size:0.65rem; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); border-bottom-width:2px; padding:1px 5px; border-radius:4px; margin:0 1px;}
.focus-ring:focus-visible{outline:none; box-shadow:0 0 0 2px rgba(255,255,255,0.9);}
.btn{
  padding:12px 18px; border-radius:10px; font-weight:500; cursor:pointer; transition:all 0.18s var(--ease);
  border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.08); color:#fff; min-height:44px;
}
.btn:hover{background:rgba(255,255,255,0.14); transform:translateY(-1px);}
.btn.primary{background:linear-gradient(135deg,#3b82f6,#6366f1); border:none; box-shadow:0 6px 20px rgba(59,130,246,0.35);}
.btn.primary:hover{transform:translateY(-1px) scale(1.01);}
.btn.kb-focus{box-shadow:0 0 0 2px rgba(255,255,255,0.95),0 8px 22px rgba(99,102,241,0.4); transform:translateY(-1px) scale(1.02);}
input, select{
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:10px;
  padding:12px 12px; color:#fff; outline:none; width:100%; min-height:44px;
}
input.kb-focus, select.kb-focus{border-color:rgba(255,255,255,0.9); box-shadow:0 0 0 2px rgba(255,255,255,0.9);}
.toggle{position:relative; width:54px; height:30px; background:rgba(255,255,255,0.15); border-radius:999px; cursor:pointer; transition:all 0.25s var(--ease); border:1px solid rgba(255,255,255,0.1); flex-shrink:0;}
.toggle.on{background:linear-gradient(135deg,#3b82f6,#8b5cf6); border-color:rgba(99,102,241,0.5); box-shadow:0 0 12px rgba(99,102,241,0.4);}
.toggle.kb-focus{box-shadow:0 0 0 2px rgba(255,255,255,0.9),0 0 12px rgba(99,102,241,0.5);}
.toggle-knob{position:absolute; top:3px; left:3px; width:22px; height:22px; background:white; border-radius:50%; transition:transform 0.3s cubic-bezier(0.4,0,0.2,1); box-shadow:0 2px 6px rgba(0,0,0,0.3);}
.toggle.on .toggle-knob{transform:translateX(24px);}
.theme-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px;}
.theme-opt{background:rgba(255,255,255,0.06); border:2px solid rgba(255,255,255,0.08); border-radius:12px; padding:10px; cursor:pointer; text-align:center; transition:all 0.18s var(--ease);}
.theme-opt.active{background:linear-gradient(135deg,rgba(59,130,246,0.2),rgba(139,92,246,0.2)); border-color:#6366f1; box-shadow:0 0 14px rgba(99,102,241,0.25);}
.theme-opt.kb-focus{border-color:#fff; box-shadow:0 0 0 1px #fff,0 0 18px rgba(255,255,255,0.2); transform:translateY(-1px); background:rgba(255,255,255,0.12);}
.theme-opt.kb-focus.active{box-shadow:0 0 0 1px #fff,0 0 20px rgba(99,102,241,0.4);}
.theme-swatch{width:100%; height:28px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); margin-bottom:6px;}
.pill{font-size:0.65rem; letter-spacing:0.5px; padding:3px 7px; border-radius:999px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1);}
.save-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,0.06); background:rgba(255,255,255,0.03); transition:all 0.18s var(--ease); cursor:pointer; min-height:52px;}
.save-row:hover{background:rgba(255,255,255,0.06); border-color:rgba(255,255,255,0.1);}
.save-row.active{border-color:rgba(99,102,241,0.5); background:rgba(99,102,241,0.12); box-shadow:0 0 12px rgba(99,102,241,0.2);}
.save-row.kb-focus{border-color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,0.9);}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
</style>
</head>
<body>
<div class="bg-container"><div class="wave"></div><div class="wave"></div></div>

<div id="app">
  <header>
    <div class="header-left">
      <div class="brand"><i class="fas fa-taco" style="color:#fbbf24"></i> MTT DASHBOARD <small id="save-label">— live</small></div>
      <span id="xmb-theme-badge" class="badge" style="opacity:0.8"><i class="fas fa-palette"></i> <span id="theme-name-label">default</span></span>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="pill" id="saves-pill"><i class="fas fa-save"></i> <span id="saves-count">0 saves</span></div>
      <div id="clock">00:00 AM</div>
    </div>
  </header>

  <nav class="sidebar" aria-label="Dashboard sections">
    <div id="nav-list">
      <div class="nav-item active" data-view="overview" tabindex="0"><i class="fas fa-th-large"></i> Overview</div>
      <div class="nav-item" data-view="saves" tabindex="-1"><i class="fas fa-database"></i> Continue</div>
      <div class="nav-item" data-view="player" tabindex="-1"><i class="fas fa-user-astronaut"></i> Player</div>
      <div class="nav-item" data-view="inventory" tabindex="-1"><i class="fas fa-box"></i> Inventory</div>
      <div class="nav-item" data-view="garage" tabindex="-1"><i class="fas fa-truck-pickup"></i> Garage</div>
      <div class="nav-item" data-view="world" tabindex="-1"><i class="fas fa-mountain"></i> World</div>
      <div class="nav-item" data-view="settings" tabindex="-1"><i class="fas fa-sliders"></i> Settings</div>
    </div>
    <div class="nav-hint">
      <div style="display:flex; align-items:center; gap:6px; margin-bottom:6px;"><i class="fas fa-gamepad" style="color:#a78bfa"></i> Controller + Keyboard</div>
      <span class="kbd">↑</span><span class="kbd">↓</span> nav &nbsp; <span class="kbd">A</span>/<span class="kbd">ENTER</span> open &nbsp; <span class="kbd">→</span> focus content<br>
      <span class="kbd">B</span>/<span class="kbd">ESC</span> back to nav &nbsp; <span class="kbd">TAB</span> next<br>
      <span id="gamepad-status" style="opacity:0.7; margin-top:6px; display:block;">No controller — keyboard ready</span>
    </div>
    <div style="margin-top:10px; display:flex; gap:8px;">
      <button id="btn-refresh" class="btn" style="flex:1; font-size:0.85rem;"><i class="fas fa-sync"></i> Refresh</button>
      <button id="btn-quit" class="btn" style="font-size:0.85rem;"><i class="fas fa-power-off"></i></button>
    </div>
  </nav>

  <main class="content" id="content" aria-live="polite"></main>

  <div style="grid-column:1 / span 2; display:flex; align-items:center; justify-content:space-between; padding:0 16px; font-size:0.7rem; color:rgba(255,255,255,0.45); background:rgba(0,0,0,0.35); backdrop-filter:blur(8px); border-top:1px solid rgba(255,255,255,0.06); letter-spacing:0.4px;">
    <span><i class="fas fa-circle" style="color:#22c55e; font-size:0.55rem;"></i> MTT Dashboard • big-screen ready</span>
    <span id="footer-hint"><span class="kbd">↑</span><span class="kbd">↓</span> move • <span class="kbd">A</span> select • <span class="kbd">B</span> back</span>
  </div>
</div>

<script>
// ---- THEMES (mirrors xmb_settings.THEMES) ----
const THEMES={
  default:{name:"Default",bg:"#050914",to:"#0a1128",wave1:"rgba(30,80,150,0.15)",wave2:"rgba(80,30,150,0.1)"},
  dark_purple:{name:"Dark Purple",bg:"#0d0514",to:"#1a0a2e",wave1:"rgba(120,40,180,0.18)",wave2:"rgba(60,20,120,0.12)"},
  crimson_red:{name:"Crimson Red",bg:"#140505",to:"#2e0a0a",wave1:"rgba(180,30,30,0.16)",wave2:"rgba(120,20,60,0.12)"},
  midnight_green:{name:"Midnight Green",bg:"#05140a",to:"#0a2814",wave1:"rgba(30,150,80,0.14)",wave2:"rgba(20,100,60,0.11)"},
  ocean_blue:{name:"Ocean Blue",bg:"#05141a",to:"#0a2830",wave1:"rgba(20,140,160,0.16)",wave2:"rgba(30,80,150,0.11)"},
  sunset_orange:{name:"Sunset Orange",bg:"#140a05",to:"#2e1a0a",wave1:"rgba(200,90,20,0.15)",wave2:"rgba(160,40,80,0.11)"},
};
const THEME_IDS=Object.keys(THEMES);
let currentTheme="default";
let fullscreenEnabled=false;
let currentView="overview";
let appState=null; // last get_state()
let savesList=[];
let currentSave=null;
let kbNavIndex=0; // sidebar index
let kbContentIndex=-1; // when focus is inside content
let focusMode="sidebar"; // sidebar | content

function applyTheme(id){
  const t=THEMES[id]||THEMES.default; currentTheme=id;
  const r=document.documentElement;
  r.style.setProperty('--bg-main',t.bg); r.style.setProperty('--bg-to',t.to);
  r.style.setProperty('--wave1',t.wave1); r.style.setProperty('--wave2',t.wave2);
  document.body.style.backgroundColor=t.bg;
  document.getElementById('theme-name-label').textContent=t.name;
  document.querySelectorAll('.theme-opt').forEach(el=>el.classList.toggle('active',el.dataset.theme===id));
}
function whenPywebviewReady(){
  return new Promise(res=>{
    if(window.pywebview&&window.pywebview.api){res(true);return;}
    let settled=false; const done=()=>{if(settled)return; settled=true; res(true);};
    window.addEventListener('pywebviewready',done,{once:true});
    let tries=0; const iv=setInterval(()=>{
      if(window.pywebview&&window.pywebview.api){clearInterval(iv);done();}
      else if(++tries>50){clearInterval(iv); if(!settled){settled=true;res(false);}}
    },100);
  });
}
async function apiCall(name,...args){
  try{
    if(window.pywebview&&window.pywebview.api&&window.pywebview.api[name]){
      return await window.pywebview.api[name](...args);
    }
  }catch(e){console.error(name,e)}
  return null;
}
async function loadSettings(){
  let res=await apiCall('get_xmb_settings');
  if(res&&res.settings){
    fullscreenEnabled=!!res.settings.fullscreen;
    let t=(res.settings.theme||'default').trim();
    if(THEMES[t]) currentTheme=t;
  } else {
    try{ const fs=localStorage.getItem('xmb_fullscreen'); if(fs!==null) fullscreenEnabled=fs==='true';
         const th=localStorage.getItem('xmb_theme'); if(th&&THEMES[th]) currentTheme=th;}catch(e){}
  }
  applyTheme(currentTheme);
}

async function fetchState(saveName){
  let res=await apiCall('get_state', saveName||null);
  if(!res){
    // fallback demo state for browser preview without pywebview
    res={status:'success',saves:currentSave? [currentSave]:[], current_save:currentSave||null, meta:{}, systems:{players:{"1":[0,0,0]}, inventory:{"1":{max_weight:35, stacks:[]}}}, hud:{player_count:1, player_pos:[0,0,0], inventory_stacks:0, inventory_items:0}, xmb_settings:{theme:currentTheme, fullscreen:fullscreenEnabled}};
  }
  if(res.status==='success'){ appState=res; savesList=res.saves||[]; currentSave=res.current_save||null; }
  else { appState=res; }
  document.getElementById('saves-count').textContent=(savesList.length||0)+" saves";
  document.getElementById('save-label').textContent=currentSave? `— ${currentSave}`: "— live";
  return res;
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const c=document.getElementById('content');
  if(!appState || appState.status!=='success'){ c.innerHTML=`<div class="card"><h3><i class="fas fa-exclamation-triangle" style="color:#fbbf24"></i> No state</h3><p class="desc">${escapeHtml(appState? appState.message||'Failed to load state' : 'Loading...')}</p><button class="btn primary" onclick="doRefresh()"><i class="fas fa-sync"></i> Retry</button></div>`; return; }
  const sys=appState.systems||{}; const hud=appState.hud||{}; const meta=appState.meta||{};
  if(currentView==='overview') renderOverview(c,sys,hud,meta);
  else if(currentView==='player') renderPlayer(c,sys,hud);
  else if(currentView==='inventory') renderInventory(c,sys);
  else if(currentView==='garage') renderGarage(c,sys);
  else if(currentView==='world') renderWorld(c,sys,hud,meta);
  else if(currentView==='saves') renderSaves(c,sys,meta);
  else if(currentView==='settings') renderSettings(c);
  wireContentFocus();
}

function hudStat(label,value,pct,color){
  pct=Math.max(0,Math.min(100,pct));
  return `<div style="margin-bottom:12px;"><div style="display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:4px;"><span style="opacity:0.8">${label}</span><span style="font-weight:600">${value}</span></div><div class="bar"><div class="bar-fill" style="width:${pct}%; background:linear-gradient(90deg, ${color}, ${color}ee)"></div></div></div>`;
}

function renderOverview(c,sys,hud,meta){
  const pos=hud.player_pos||[0,0,0];
  const sysKeys=Object.keys(sys).join(', ')||'none yet';
  c.innerHTML=`
  <div class="grid2">
    <div class="card">
      <h3><i class="fas fa-heart" style="color:#f43f5e"></i> Survival</h3>
      <p class="desc">Live HUD from your current save.</p>
      ${hudStat('Health', hud.player_count? '100 / 100':'—', 92,'#22c55e')}
      ${hudStat('Stamina', '78 / 100', 78,'#38bdf8')}
      ${hudStat('Hunger', '64 / 100', 64,'#f59e0b')}
      ${hudStat('Weight Load', (hud.inventory_items||0)+' items • '+(hud.inventory_stacks||0)+' stacks', Math.min(100, (hud.inventory_stacks||0)*12+20),'#a78bfa')}
      <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
        <span class="pill"><i class="fas fa-map-marker-alt"></i> Pos ${pos.map(n=>Number(n).toFixed(1)).join(', ')}</span>
        <span class="pill"><i class="fas fa-users"></i> ${hud.player_count||0} players</span>
      </div>
    </div>
    <div class="card">
      <h3><i class="fas fa-compass" style="color:#34d399"></i> Systems</h3>
      <p class="desc">Each MTT system from saves/<code style="background:rgba(255,255,255,0.08); padding:2px 6px; border-radius:4px;">.xml</code></p>
      <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:10px;">
        ${Object.keys(sys).map(k=>{
          const v=sys[k];
          let sub='';
          if(v && typeof v==='object' && !Array.isArray(v)) sub=Object.keys(v).slice(0,3).join(', ');
          else if(Array.isArray(v)) sub=v.length+' entries';
          else sub=String(v).slice(0,30);
          return `<div style="padding:10px; border-radius:10px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06);"><div style="font-weight:600; font-size:0.85rem;"><i class="fas fa-cube" style="color:#a78bfa"></i> ${escapeHtml(k)}</div><div class="mono" style="font-size:0.7rem; opacity:0.6; margin-top:4px; word-break:break-all;">${escapeHtml(sub||'—')}</div></div>`;
        }).join('') || '<div style="opacity:0.6; font-size:0.85rem;">No systems yet — create a save in-game to see data here.</div>'}
      </div>
      <div style="margin-top:12px; font-size:0.75rem; color:rgba(255,255,255,0.5)">Systems found: <span class="mono">${escapeHtml(sysKeys)}</span></div>
      <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn primary" onclick="navigateView('saves')"><i class="fas fa-database"></i> Continue</button>
        <button class="btn" onclick="navigateView('player')"><i class="fas fa-user-astronaut"></i> Player</button>
      </div>
    </div>
  </div>
  <div class="grid2" style="margin-top:16px;">
    <div class="card">
      <h3><i class="fas fa-map" style="color:#fbbf24"></i> Map</h3>
      <p class="desc">Big-screen map preview at your current position.</p>
      <div style="height:180px; border-radius:12px; background:repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 24px), repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 24px), radial-gradient(ellipse at 30% 30%, rgba(99,102,241,0.25), transparent 60%), rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;">
        <div style="width:16px; height:16px; background:#22c55e; border-radius:50%; box-shadow:0 0 14px #22c55e; border:2px solid white;"></div>

// ---- actions ----
async function toggleFullscreen(){
  fullscreenEnabled=!fullscreenEnabled;
  const t=document.getElementById('fs-toggle'); if(t){ t.classList.toggle('on',fullscreenEnabled); t.setAttribute('aria-checked',String(fullscreenEnabled)); }
  await apiCall('set_fullscreen', fullscreenEnabled);
  try{ localStorage.setItem('xmb_fullscreen', String(fullscreenEnabled)); }catch(e){}
}
async function selectTheme(id){
  applyTheme(id);
  await apiCall('set_theme', id);
  try{ localStorage.setItem('xmb_theme', id); }catch(e){}
  document.querySelectorAll('.theme-opt').forEach(el=>el.classList.toggle('active',el.dataset.theme===id));
}
async function doRefresh(saveName){
  await fetchState(saveName||currentSave||null);
  if(!saveName && currentSave) await apiCall('refresh', currentSave);
  else if(!saveName) await apiCall('refresh');
  await fetchState(currentSave||null);
  render();
}
async function loadSave(name){
  await fetchState(name);
  render();
  navigateView('overview');
}
async function createSave(){
  const inp=document.getElementById('new-save-name');
  const name=(inp&&inp.value||'').trim()||'dashboard_save';
  const sys=(appState&&appState.systems)||{};
  const res=await apiCall('save_state', name, {systems:sys});
  if(res&&res.status==='success'){
    await fetchState(name);
    render();
    if(inp) inp.value='';
  } else {
    alert(res? res.message : 'Save failed (no bridge)');
    savesList.push(name); render();
  }
}
async function quickSave(){
  if(!currentSave){ createSave(); return; }
  const sys=(appState&&appState.systems)||{};
  const res=await apiCall('save_state', currentSave, {systems:sys});
  if(res&&res.status==='success'){ await fetchState(currentSave); render(); }
}
async function deleteSave(name){
  if(!confirm(`Delete ${name}.xml ?`)) return;
  const res=await apiCall('delete_save', name);
  if(res&&res.status==='success') { if(currentSave===name) currentSave=null; await fetchState(null); render(); }
  else { savesList=savesList.filter(s=>s!==name); render(); }
}
async function doQuit(){
  await apiCall('quit_dashboard');
  setTimeout(()=>window.close(),300);
}

// ---- view navigation + keyboard ----
function navigateView(view){
  currentView=view;
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.view===view);
    el.setAttribute('tabindex', el.dataset.view===view?'0':'-1');
  });
  kbNavIndex=[...document.querySelectorAll('.nav-item')].findIndex(el=>el.dataset.view===view);
  if(kbNavIndex<0) kbNavIndex=0;
  focusMode='sidebar';
  kbContentIndex=-1;
  render();
  const active=document.querySelector('.nav-item.active');
  if(active) active.focus();
}

function wireContentFocus(){
  const c=document.getElementById('content');
  const focusables=[...c.querySelectorAll('button, input, select, [tabindex="0"]')];
  focusables.forEach((el,i)=>{
    el.dataset.kbIdx=String(i);
    el.addEventListener('focus',()=>el.classList.add('kb-focus'));
    el.addEventListener('blur',()=>el.classList.remove('kb-focus'));
  });
}

document.addEventListener('DOMContentLoaded', async ()=>{
  await whenPywebviewReady();
  await loadSettings();
  await fetchState(null);
  render();
  setupNavKeyboard();
  startGamepad();
  setInterval(()=>{ const el=document.getElementById('clock'); if(el) el.textContent=new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); },1000);
  document.getElementById('btn-refresh').onclick=()=>doRefresh();
  document.getElementById('btn-quit').onclick=doQuit;
  document.getElementById('nav-list').addEventListener('click',(e)=>{
    const item=e.target.closest('.nav-item'); if(item) navigateView(item.dataset.view);
  });
});

function setupNavKeyboard(){
  window.addEventListener('keydown',(e)=>{
    const ae=document.activeElement;
    const isTyping=ae && (ae.tagName==='INPUT' || ae.tagName==='SELECT');
    if(isTyping && ae.id==='new-save-name'){
      if(e.key==='Enter'){ e.preventDefault(); createSave(); return; }
      if(e.key==='Escape'){ ae.blur(); return; }
      return;
    }
    if(isTyping && e.key!=='Escape' && e.key!=='Tab' && !e.key.startsWith('Arrow')) return;

    const navItems=[...document.querySelectorAll('.nav-item')];
    const contentFocusables=[...document.querySelectorAll('#content button, #content input, #content select, #content [tabindex="0"]')];

    if(e.key==='Escape' || e.key==='Backspace'){
      if(focusMode==='content'){
        e.preventDefault(); focusMode='sidebar'; kbContentIndex=-1;
        contentFocusables.forEach(el=>el.classList.remove('kb-focus'));
        navItems[kbNavIndex]?.focus();
        navItems.forEach((el,i)=>el.classList.toggle('kb-focus', i===kbNavIndex));
        return;
      }
    }

    if(focusMode==='sidebar'){
      if(e.key==='ArrowUp'){
        e.preventDefault(); kbNavIndex=Math.max(0,kbNavIndex-1); updateSidebarFocus();
      } else if(e.key==='ArrowDown'){
        e.preventDefault(); kbNavIndex=Math.min(navItems.length-1,kbNavIndex+1); updateSidebarFocus();
      } else if(e.key==='ArrowRight' || e.key==='Tab'){
        if(contentFocusables.length){
          e.preventDefault(); focusMode='content'; kbContentIndex=0;
          contentFocusables[0].focus(); contentFocusables[0].classList.add('kb-focus');
        }
      } else if(e.key==='Enter' || e.key===' '){
        e.preventDefault(); const v=navItems[kbNavIndex]?.dataset.view; if(v) navigateView(v);
      }
    } else if(focusMode==='content'){
      if(e.key==='ArrowUp' || e.key==='ArrowLeft'){
        e.preventDefault();
        if(kbContentIndex>0){ contentFocusables[kbContentIndex]?.classList.remove('kb-focus'); kbContentIndex--; contentFocusables[kbContentIndex].focus(); contentFocusables[kbContentIndex].classList.add('kb-focus'); }
        else {
          contentFocusables[kbContentIndex]?.classList.remove('kb-focus');
          focusMode='sidebar'; kbContentIndex=-1; updateSidebarFocus();
        }
      } else if(e.key==='ArrowDown' || e.key==='ArrowRight'){
        e.preventDefault();
        if(kbContentIndex < contentFocusables.length-1){ contentFocusables[kbContentIndex]?.classList.remove('kb-focus'); kbContentIndex++; contentFocusables[kbContentIndex].focus(); contentFocusables[kbContentIndex].classList.add('kb-focus'); }
      } else if(e.key==='Tab'){
        e.preventDefault();
        contentFocusables[kbContentIndex]?.classList.remove('kb-focus');
        kbContentIndex=(kbContentIndex+1)%contentFocusables.length;
        contentFocusables[kbContentIndex].focus(); contentFocusables[kbContentIndex].classList.add('kb-focus');
      }
    }
  });

  function updateSidebarFocus(){
    const items=[...document.querySelectorAll('.nav-item')];
    items.forEach((el,i)=>{
      el.classList.toggle('kb-focus', i===kbNavIndex);
      if(i===kbNavIndex) el.focus();
    });
  }
  const items=[...document.querySelectorAll('.nav-item')];
  items[0]?.classList.add('kb-focus');
}

// ---- Gamepad (D-Pad -> Arrows, A -> Enter, B -> Backspace) ----
let gpRaf=null, lastGP={up:false,down:false,left:false,right:false,a:false,b:false}, repeat={up:0,down:0,left:0,right:0};
function simKey(k){ window.dispatchEvent(new KeyboardEvent('keydown',{key:k,bubbles:true,cancelable:true})); }
function pollGP(){
  const pads=navigator.getGamepads? navigator.getGamepads():[];
  let gp=null; for(let i=0;i<pads.length;i++) if(pads[i]){gp=pads[i]; break;}
  if(gp){
    const dead=0.5, ax0=gp.axes[0]||0, ax1=gp.axes[1]||0;
    const btn=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
    const up=btn(12)||ax1<-dead, down=btn(13)||ax1>dead, left=btn(14)||ax0<-dead, right=btn(15)||ax0>dead, a=btn(0), b=btn(1);
    const now=performance.now();
    const h=(pressed,was,name,key)=>{ if(pressed){ if(!was){simKey(key); repeat[name]=now+300;} else if(now>=repeat[name]){simKey(key); repeat[name]=now+130;}}};
    h(up,lastGP.up,'up','ArrowUp'); h(down,lastGP.down,'down','ArrowDown'); h(left,lastGP.left,'left','ArrowLeft'); h(right,lastGP.right,'right','ArrowRight');
    if(a&&!lastGP.a) simKey('Enter');
    if(b&&!lastGP.b) simKey('Backspace');
    document.getElementById('gamepad-status').textContent=`Controller: ${gp.id.slice(0,32)}`;
    lastGP={up,down,left,right,a,b};
  } else {
    lastGP={up:false,down:false,left:false,right:false,a:false,b:false};
    document.getElementById('gamepad-status').textContent='No controller — keyboard ready';
  }
  gpRaf=requestAnimationFrame(pollGP);
}
function startGamepad(){
  if(gpRaf!==null) return;
  gpRaf=requestAnimationFrame(pollGP);
  window.addEventListener('gamepadconnected',e=>{ console.log('pad',e.gamepad.id); startGamepad(); });
}
</script>
